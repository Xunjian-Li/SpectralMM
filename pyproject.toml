[build-system]
requires = ["scikit-build-core>=0.10,<1", "cmake>=3.18"]
build-backend = "scikit_build_core.build"

[project]
name = "SpectralMM"
version = "0.1.0"
description = "Spectral majorization for statistical estimation"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Xun-Jian Li", email = "xunjianli@ucla.edu"}]
dependencies = ["numpy>=1.22", "scipy>=1.8", "patsy>=0.5.6"]

[project.urls]
Homepage = "https://github.com/Xunjian-Li/SpectralMM"
Issues = "https://github.com/Xunjian-Li/SpectralMM/issues"

[tool.scikit-build]
cmake.source-dir = "cpp"
cmake.build-type = "Release"
wheel.packages = ["bindings/python/spectralmm"]
wheel.py-api = "py3"
sdist.include = ["pyproject.toml", "README.md", "LICENSE", "cpp/CMakeLists.txt", "cpp/THIRD_PARTY_NOTICES.md", "bindings/python/spectralmm/**", "src/native/**"]
sdist.exclude = ["maintainer/**", "julia/**", "docs/**", "build/**", "output/**", ".RData", ".Rhistory", "*.ipynb", "Manifest.toml", "benchmark/**", ".git/**"]

[tool.scikit-build.cmake.define]
SPECTRALMM_FETCH_EIGEN = "ON"
SPECTRALMM_USE_BLAS = "AUTO"
