name: Publish Python package to PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require successful package checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/package-checks.yml/runs?head_sha=$GITHUB_SHA&per_page=20" > checks.json
          python - <<'PY'
          import json
          runs = json.load(open('checks.json'))['workflow_runs']
          if not runs or runs[0]['conclusion'] != 'success':
              raise SystemExit('All independent package checks must pass for this exact commit.')
          PY
      - run: python -m pip install build twine
      - run: python tools/build_packages.py --language Python
      - run: python -m build --sdist --outdir release dist/Python/SpectralMM
      - run: python -m twine check release/*
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-source
          path: release/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-source
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
